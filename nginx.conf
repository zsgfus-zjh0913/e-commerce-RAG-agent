upstream ecommerce_backend {
    server 127.0.0.1:5000;
    # server 127.0.0.1:5001;  # 水平扩展时取消注释
    # server 127.0.0.1:5002;
}

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://ecommerce_backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE 流式输出支持
        proxy_buffering    off;
        proxy_cache         off;
        proxy_read_timeout  300s;
        chunked_transfer_encoding on;
    }

    # 静态文件直接由 Nginx 处理
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 限流
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req zone=api burst=20 nodelay;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    location /api/login { limit_req zone=auth burst=5 nodelay; proxy_pass http://ecommerce_backend; }
    location /api/register { limit_req zone=auth burst=5 nodelay; proxy_pass http://ecommerce_backend; }
}

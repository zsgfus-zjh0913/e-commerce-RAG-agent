<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
    <title>坐席工作台 · 登录</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20261110d">
    <style>
        /* 坐席登录页：完全沿用 style.css 的设计令牌，不再另起一套配色 */
        body { margin: 0; }

        .agent-login-body {
            background: var(--bg);
            display: flex;
            /* 同上：用 auto 外边距居中，避免内容超高时顶部被裁切 */
            align-items: flex-start;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            padding: 24px 20px;
            box-sizing: border-box;
        }

        /* 极淡网格底纹：给大面积留白一点质感，不用彩色渐变 */
        .agent-login-body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, var(--line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.5;
            -webkit-mask-image: radial-gradient(ellipse at 50% 38%, #000 26%, transparent 76%);
            mask-image: radial-gradient(ellipse at 50% 38%, #000 26%, transparent 76%);
        }

        .agent-login-card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-xl);
            padding: 40px 36px 30px;
            width: 400px;
            max-width: calc(100vw - 40px);
            margin: auto 0;
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
        }

        /* 头部 */
        .agent-login-header { text-align: center; margin-bottom: 26px; }

        .agent-login-logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border-radius: var(--r-lg);
            background: var(--brand-50);
            border: 1px solid var(--brand-100);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .agent-login-logo svg { width: 30px; height: 30px; }
        .agent-login-logo svg path { fill: var(--brand-500); }
        .agent-login-logo svg circle { fill: var(--surface); }

        .agent-login-header h1 {
            font-size: 19px;
            font-weight: 650;
            color: var(--text-1);
            margin: 0 0 6px;
            letter-spacing: -0.01em;
        }
        .agent-login-header p { font-size: 12.5px; color: var(--text-3); margin: 0; }

        /* 表单 */
        .agent-login-form { display: flex; flex-direction: column; gap: 14px; }
        .agent-form-group { display: flex; flex-direction: column; gap: 6px; }
        .agent-form-group label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }

        .agent-form-group input {
            padding: 11px 14px;
            border: 1px solid var(--line-strong);
            border-radius: var(--r-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--text-1);
            background: var(--surface-muted);
            outline: none;
            box-sizing: border-box;
            transition: border-color var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease),
                background var(--dur) var(--ease);
        }
        .agent-form-group input::placeholder { color: var(--text-3); }
        .agent-form-group input:focus {
            border-color: var(--brand-500);
            background: var(--surface);
            box-shadow: var(--focus-ring);
        }

        .agent-submit {
            padding: 12px;
            background: var(--brand-solid);
            color: var(--on-brand);
            border: 1px solid transparent;
            border-radius: var(--r-sm);
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            margin-top: 6px;
            transition: background var(--dur) var(--ease),
                box-shadow var(--dur) var(--ease);
        }
        .agent-submit:hover { background: var(--brand-solid-hover); box-shadow: var(--shadow-sm); }
        .agent-submit:active { box-shadow: none; }
        .agent-submit:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

        .agent-submit:focus-visible,
        .agent-footer a:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
        }

        /* 提示信息：默认留白，只有成功/失败时才上底色 */
        .agent-message {
            text-align: center;
            font-size: 12.5px;
            margin-top: 12px;
            min-height: 18px;
            border-radius: var(--r-sm);
            color: var(--text-3);
            transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
        }
        .agent-message.error {
            color: var(--danger-fg);
            background: var(--danger-bg);
            padding: 8px 12px;
        }
        .agent-message.success {
            color: var(--success-fg);
            background: var(--success-bg);
            padding: 8px 12px;
        }

        /* 演示账号 */
        .demo-info {
            margin-top: 20px;
            padding: 13px 16px;
            background: var(--surface-muted);
            border: 1px dashed var(--line-strong);
            border-radius: var(--r-md);
            font-size: 12.5px;
            color: var(--text-2);
            line-height: 2;
        }
        .demo-info .demo-title {
            font-weight: 600;
            color: var(--text-2);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .demo-info .demo-title svg { width: 13px; height: 13px; }
        .demo-info .demo-title svg path { fill: var(--brand-500); }
        .demo-info b { color: var(--text-1); font-weight: 600; }
        .demo-info code {
            background: var(--brand-50);
            color: var(--brand-700);
            border: 1px solid var(--brand-100);
            padding: 1px 7px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 12px;
        }

        .agent-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12.5px;
            color: var(--text-3);
        }
        .agent-footer a {
            color: var(--brand-600);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--dur) var(--ease);
        }
        .agent-footer a:hover { color: var(--brand-700); text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="agent-login-body">
    <div class="agent-login-card">
        <div class="agent-login-header">
            <div class="agent-login-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7 2 3 6 3 11c0 3.4 2 6.3 5 7.6V21a1 1 0 0 0 1.5.9L12 20l2.5 1.9A1 1 0 0 0 16 21v-2.4c3-1.3 5-4.2 5-7.6C21 6 17 2 12 2Z" fill="#ffffff"/>
                    <circle cx="12" cy="11" r="1.6" fill="#5B8FE5"/>
                    <circle cx="8" cy="11" r="1.6" fill="#5B8FE5"/>
                    <circle cx="16" cy="11" r="1.6" fill="#5B8FE5"/>
                </svg>
            </div>
            <h1>客服坐席工作台</h1>
            <p>人工客服登录入口 · 工单处理与用户会话</p>
        </div>

        <form class="agent-login-form" onsubmit="return login(event)">
            <div class="agent-form-group">
                <label for="username">坐席账号</label>
                <input type="text" id="username" placeholder="输入坐席账号..." autocomplete="off" required>
            </div>
            <div class="agent-form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="输入密码..." required>
            </div>
            <button type="submit" class="agent-submit" id="login-btn">登录工作台</button>
        </form>
        <div id="message" class="agent-message" role="status" aria-live="polite"></div>

        <div class="demo-info">
            <div class="demo-title">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z" fill="#5B8FE5"/>
                </svg>
                演示账号
            </div>
            <b>客服小王</b>　<code>agent001 / agent123</code><br>
            <b>客服小李</b>　<code>agent002 / agent456</code><br>
            <b>管理员</b>　　<code>admin / admin123</code>
        </div>

        <div class="agent-footer">
            没有坐席账号？<a href="/login">返回用户端</a>
        </div>
    </div>

    <script>
        async function login(e) {
            e.preventDefault();
            const btn = document.getElementById("login-btn");
            const msg = document.getElementById("message");
            btn.disabled = true;
            btn.textContent = "登录中...";
            msg.className = "agent-message";
            msg.textContent = "";

            try {
                const res = await fetch("/api/agent/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value,
                    }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    msg.className = "agent-message success";
                    msg.textContent = "登录成功，正在跳转...";
                    setTimeout(() => window.location.href = "/agent/dashboard", 500);
                } else {
                    msg.className = "agent-message error";
                    msg.textContent = data.error || "登录失败";
                }
            } catch (err) {
                msg.className = "agent-message error";
                msg.textContent = "网络错误: " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "登录工作台";
            }
            return false;
        }
    </script>
</body>
</html>

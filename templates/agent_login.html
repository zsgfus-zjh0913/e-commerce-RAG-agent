<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坐席工作台 · 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { margin: 0; }
        .agent-login-body {
            background: linear-gradient(135deg, #e8f0fe 0%, #dbe7fb 50%, #c9daf8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        /* 背景装饰圆 */
        .agent-login-body::before,
        .agent-login-body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .agent-login-body::before {
            width: 420px; height: 420px;
            background: rgba(91,143,229,0.12);
            top: -120px; right: -100px;
        }
        .agent-login-body::after {
            width: 320px; height: 320px;
            background: rgba(255,255,255,0.35);
            bottom: -100px; left: -80px;
        }
        .agent-login-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border-radius: 24px;
            padding: 44px 40px 32px;
            width: 400px;
            max-width: calc(100vw - 40px);
            box-shadow: 0 16px 48px rgba(91,143,229,0.18), 0 2px 8px rgba(91,143,229,0.08);
            border: 1px solid rgba(91,143,229,0.10);
            box-sizing: border-box;
        }
        /* 头部 */
        .agent-login-header { text-align: center; margin-bottom: 28px; }
        .agent-login-logo {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, #5B8FE5 0%, #3f6fd0 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(91,143,229,0.35);
        }
        .agent-login-logo svg { width: 34px; height: 34px; }
        .agent-login-header h1 {
            font-size: 20px; font-weight: 700; color: #2d3748;
            margin: 0 0 6px; letter-spacing: 0.5px;
        }
        .agent-login-header p { font-size: 13px; color: #8a97ad; margin: 0; }
        /* 表单 */
        .agent-login-form { display: flex; flex-direction: column; gap: 16px; }
        .agent-form-group { display: flex; flex-direction: column; gap: 6px; }
        .agent-form-group label { font-size: 13px; font-weight: 600; color: #4A5568; }
        .agent-form-group input {
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: #2d3748;
            outline: none;
            transition: all 0.25s;
            background: #f8fafd;
            box-sizing: border-box;
        }
        .agent-form-group input::placeholder { color: #aab6c8; }
        .agent-form-group input:focus {
            border-color: #5B8FE5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(91,143,229,0.12);
        }
        .agent-submit {
            padding: 13px;
            background: linear-gradient(135deg, #5B8FE5 0%, #4A7BD8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .agent-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(91,143,229,0.35); }
        .agent-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .agent-message {
            text-align: center; font-size: 13px; margin-top: 12px; min-height: 20px;
            border-radius: 8px; padding: 6px 10px;
        }
        .agent-message.error { color: #e53e3e; background: rgba(229,62,62,0.06); }
        .agent-message.success { color: #2f855a; background: rgba(47,133,90,0.06); }
        /* 演示账号卡片 */
        .demo-info {
            margin-top: 22px;
            padding: 14px 16px;
            background: #f6f9fe;
            border: 1px dashed #c9daf8;
            border-radius: 12px;
            font-size: 12.5px;
            color: #64748b;
            line-height: 2;
        }
        .demo-info .demo-title {
            font-weight: 700; color: #5B8FE5; font-size: 12px;
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 2px;
        }
        .demo-info .demo-title svg { width: 13px; height: 13px; }
        .demo-info b { color: #334155; font-weight: 600; }
        .demo-info code {
            background: #e8f0fe; color: #3f6fd0;
            padding: 1px 7px; border-radius: 6px;
            font-family: Consolas, monospace; font-size: 12px;
        }
        .agent-footer {
            text-align: center; margin-top: 20px; font-size: 12.5px; color: #8a97ad;
        }
        .agent-footer a {
            color: #5B8FE5; text-decoration: none; font-weight: 600;
            transition: color 0.2s;
        }
        .agent-footer a:hover { color: #3f6fd0; text-decoration: underline; }
    </style>
</head>
<body class="agent-login-body">
    <div class="agent-login-card">
        <div class="agent-login-header">
            <div class="agent-login-logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7 2 3 6 3 11c0 3.4 2 6.3 5 7.6V21a1 1 0 0 0 1.5.9L12 20l2.5 1.9A1 1 0 0 0 16 21v-2.4c3-1.3 5-4.2 5-7.6C21 6 17 2 12 2Z" fill="#ffffff"/>
                    <circle cx="12" cy="11" r="1.6" fill="#5B8FE5"/>
                    <circle cx="8" cy="11" r="1.6" fill="#5B8FE5"/>
                    <circle cx="16" cy="11" r="1.6" fill="#5B8FE5"/>
                </svg>
            </div>
            <h1>客服坐席工作台</h1>
            <p>人工客服登录入口 · 工单处理与用户会话</p>
        </div>

        <form class="agent-login-form" onsubmit="return login(event)">
            <div class="agent-form-group">
                <label>坐席账号</label>
                <input type="text" id="username" placeholder="输入坐席账号..." autocomplete="off" required>
            </div>
            <div class="agent-form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="输入密码..." required>
            </div>
            <button type="submit" class="agent-submit" id="login-btn">登录工作台</button>
        </form>
        <div id="message" class="agent-message"></div>

        <div class="demo-info">
            <div class="demo-title">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z" fill="#5B8FE5"/>
                </svg>
                演示账号
            </div>
            <b>客服小王</b>　<code>agent001 / agent123</code><br>
            <b>客服小李</b>　<code>agent002 / agent456</code><br>
            <b>管理员</b>　　<code>admin / admin123</code>
        </div>

        <div class="agent-footer">
            没有坐席账号？<a href="/login">返回用户端</a>
        </div>
    </div>

    <script>
        async function login(e) {
            e.preventDefault();
            const btn = document.getElementById("login-btn");
            const msg = document.getElementById("message");
            btn.disabled = true;
            btn.textContent = "登录中...";
            msg.className = "agent-message";
            msg.textContent = "";

            try {
                const res = await fetch("/api/agent/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value,
                    }),
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    msg.className = "agent-message success";
                    msg.textContent = "登录成功，正在跳转...";
                    setTimeout(() => window.location.href = "/agent/dashboard", 500);
                } else {
                    msg.className = "agent-message error";
                    msg.textContent = data.error || "登录失败";
                }
            } catch (err) {
                msg.className = "agent-message error";
                msg.textContent = "网络错误: " + err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = "登录工作台";
            }
            return false;
        }
    </script>
</body>
</html>

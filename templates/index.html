<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暖小助客服 · 电商智能客服</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260914b">
</head>
<body>
<div id="app">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 侧边栏 -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="user-info">
                <div id="user-avatar" class="user-avatar">👦</div>
                <div class="user-meta">
                    <span id="user-name" class="user-name">用户</span>
                    <span class="user-role">在线客服</span>
                </div>
            </div>
            <button id="sidebar-toggle" class="sidebar-toggle-btn" aria-label="收起侧边栏" title="收起侧边栏">≫≫≫</button>
        </div>

        <div class="sidebar-section">
            <button id="new-chat-btn" class="new-chat-btn" onclick="newConversation()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>新对话</span>
            </button>
        </div>

        <!-- 历史记录 -->
        <div class="sidebar-section history-section">
            <h3 class="section-title">历史记录</h3>
            <div id="history-list" class="history-list">
                <div class="history-empty">暂无历史对话</div>
            </div>
        </div>

        <!-- 我的工单 -->
        <div class="sidebar-section ticket-section">
            <div class="section-header">
                <h3 class="section-title">我的工单</h3>
                <span id="ticket-count" class="doc-count">0</span>
            </div>
            <div id="ticket-list" class="ticket-list">
                <div class="ticket-empty">暂无工单</div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="sidebar-footer">
            <div id="stats" class="stats">
                <span class="stat-item">文档：<b id="stat-docs">0</b></span>
                <span class="stat-item">文本块：<b id="stat-chunks">0</b></span>
            </div>
            <button id="logout-btn" class="logout-btn" onclick="logout()">退出登录</button>
        </div>
    </aside>

    <!-- 主聊天区 -->
    <main id="main">
        <header class="chat-header">
            <button id="sidebar-expand" class="sidebar-expand-btn" aria-label="展开侧边栏" title="展开侧边栏">≪≪≪</button>
            <div class="chat-header-text">
                <h1>暖小助客服</h1>
                <p class="chat-subtitle">商品咨询 · 退换货处理 · 售后服务</p>
            </div>
            <div class="chat-header-right">
                <div id="llm-status" class="llm-status-badge disconnected">
                    <span class="llm-dot"></span>
                    <span class="llm-text">离线模式</span>
                </div>
                <div class="api-key-panel">
                    <button id="api-key-toggle" class="api-key-toggle-btn" title="配置 API Key">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </button>
                    <div id="api-key-dropdown" class="api-key-dropdown">
                        <div class="api-key-dropdown-header">
                            <span>模型设置</span>
                            <span class="settings-value">DeepSeek</span>
                        </div>
                        <div class="api-key-input-group">
                            <input type="password" id="api-key-input" class="key-input"
                                   placeholder="输入 API Key..." autocomplete="off">
                            <button id="save-key-btn" class="save-key-btn">保存</button>
                        </div>
                        <p class="settings-hint">未配置时使用离线 RAG 检索</p>
                    </div>
                </div>
            </div>
        </header>

        <div id="chat-messages" class="chat-messages">
            <div class="message bot-message">
                <div class="message-avatar bot-avatar">🌸</div>
                <div class="message-content">
                    <div class="message-text">
                        您好，我是客服助手<strong>暖小助</strong>。我可以帮您：
                        <br><br>
                        <strong>商品信息</strong> — 查询商品详情、价格、尺码、库存<br>
                        <strong>更换商品</strong> — 换货政策、换码流程<br>
                        <strong>退换货</strong> — 退货政策、退款进度<br>
                        <strong>物流咨询</strong> — 发货时间、运费、配送时效<br>
                        <strong>转人工</strong> — 说"转人工"即可接入人工客服
                        <br><br>
                        <span class="example-hint">试试以下问题：</span>
                    </div>
                    <div class="example-questions">
                        <button class="example-q" onclick="askExample('有哪些商品？')">有哪些商品？</button>
                        <button class="example-q" onclick="askExample('服装尺码表是怎样的？')">服装尺码表</button>
                        <button class="example-q" onclick="askExample('退换货政策是什么？')">退换货政策</button>
                        <button class="example-q" onclick="askExample('蓝牙耳机的参数？')">蓝牙耳机参数</button>
                        <button class="example-q" onclick="askExample('我要退款')">申请退款</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div id="image-preview" class="image-preview" style="display:none">
                <img id="image-preview-img" alt="商品图片预览">
                <span id="image-preview-name"></span>
                <button id="image-remove-btn" type="button" title="移除图片">×</button>
            </div>
            <div class="chat-input-wrapper">
                <button id="image-upload-btn" class="image-upload-btn" type="button" title="上传商品图片">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <path d="M21 15l-5-5L5 21"></path>
                    </svg>
                </button>
                <input id="image-input" type="file" accept=".jpg,.jpeg,.png,.webp,.bmp,image/*" hidden>
                <input type="text" id="chat-input" class="chat-input"
                       placeholder="输入问题，或上传商品图片..." autocomplete="off">
                <button id="send-btn" class="send-btn" onclick="sendMessage()">
                    <span>发送</span>
                    <span class="send-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </span>
                </button>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="/static/js/main.js?v=20260914c"></script>
</body>
</html>
